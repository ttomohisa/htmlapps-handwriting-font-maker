# PR source code must never run on the credential-bearing runner.
name: Cleanup PR preview
'on':
  pull_request_target:
    branches:
    - main
    types:
    - closed
permissions:
  contents: read
concurrency:
  group: cloudflare-pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout immutable trusted workflow revision
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 24
    - name: Install trusted cleanup tool outside PR workspace
      run: |
        mkdir -p "$RUNNER_TEMP/preview-control"
        cd "$RUNNER_TEMP/preview-control"
        npm install --prefix . --ignore-scripts --no-audit --no-fund --package-lock=false wrangler@4.135.0
    - name: Delete preview using trusted configuration
      run: node .github/scripts/preview-command.cjs delete
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        PREVIEW_NAME: r${{ github.event.repository.id }}-pr-${{ github.event.pull_request.number }}
