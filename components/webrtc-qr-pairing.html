<!--
Reusable WebRTC QR pairing component
====================================

Purpose
- Fully serverless WebRTC pairing for two browsers on the same reachable LAN.
- Manual signaling only: Offer/Answer travel by QR code or copy/paste.
- No signaling server, STUN, TURN, WebSocket, or runtime API.
- Robust ICE collection, connection diagnostics, QR chunking, low-resolution camera fallback,
  delayed Answer creation, stale-attempt cleanup, and pre-connect Answer regeneration.

Required embedded dependencies
- qrcode-generator 1.4.4 (global: qrcode)
- jsqr 1.4.0 (global: jsQR) as a fallback when BarcodeDetector is unavailable

Copy the entries from examples/dependencies.webrtc-qr.json into the target app's dependencies.json, then run scripts/sync-dependency-lock.ps1.
This component expects the template's window.StandaloneAssets API.

Basic usage
  <div id="peerPairing"></div>
  <script>
    const pairing = AppWebRtcQrPairing.mount(document.getElementById('peerPairing'), {
      language: 'ja',
      onConnected({ role, channel }) {
        console.log('connected as', role);
        channel.send('hello');
      },
      onMessage({ data }) {
        console.log('peer says', data);
      }
    });
  </script>

Apps that need custom/unreliable channels can set createDefaultChannel:false and use onPeerCreated.
See docs/WEBRTC_QR_PAIRING.ja.md / docs/WEBRTC_QR_PAIRING.md.
-->

    function resetHost({keepView=false}={}) { state.host.attempt+=1; closePc('host');state.host.offerCode='';state.host.answerApplied=false;state.connected=false;stopQr('host');stopScanner();q('[data-host-offer-code]').value='';q('[data-host-answer-input]').value='';q('[data-action="host-copy"]').disabled=true;q('[data-action="host-scan-answer"]').disabled=true;q('[data-action="host-apply-answer"]').disabled=true;q('[data-connected="host"]').hidden=true;q('[data-diagnostic="host"]').hidden=true;setStep('host',1);setCoach('host','offer');setStatus('host',t('stateNew'));renderQrPlaceholder('host',t('offerPlaceholder'));if(!keepView)showView('chooser'); }
    function resetJoin({preserveOffer=false,preserveRetry=false,keepView=false}={}) { state.join.attempt+=1; closePc('join');state.connected=false;stopQr('join');stopScanner();state.join.answerCode='';state.join.answerState=preserveOffer&&state.join.pendingOffer?'prepare':'idle';if(!preserveOffer)state.join.pendingOffer=null;if(!preserveRetry)state.join.autoRetryCount=0;if(state.join.autoRetryTimer)clearTimeout(state.join.autoRetryTimer);state.join.autoRetryTimer=0;q('[data-join-answer-code]').value='';q('[data-join-answer]').hidden=true;q('[data-connected="join"]').hidden=true;q('[data-diagnostic="join"]').hidden=true;q('[data-join-prepare]').hidden=!state.join.pendingOffer;setStep('join',state.join.pendingOffer?2:1);setCoach('join',state.join.pendingOffer?'prepare':'scan');setStatus('join',t('stateNew'));if(!keepView)showView('chooser'); }
    function resetAll() { resetHost({keepView:true});resetJoin({keepView:true});state.role='';showView('chooser'); }

    async function startHost() { resetJoin({keepView:true});state.role='host';showView('host');applyLanguage();await createHostOffer(); }
    async function createHostOffer() {
      resetHost({keepView:true});state.role='host';showView('host');setCoach('host','offer');const attempt=++state.host.attempt;setStatus('host',t('creatingOffer'),'warning');q('[data-action="host-create"]').disabled=true;emitState('host','creating-offer');
      let pc=null;
      try {
        pc=createPeer('host',attempt);state.host.pc=pc;
        if(options.createDefaultChannel!==false){const ch=pc.createDataChannel(options.dataChannelLabel,options.dataChannelInit);state.host.channel=ch;bindChannel('host',ch,pc,attempt);}
        await pc.setLocalDescription(await pc.createOffer());setStatus('host',t('waitingIce'),'warning');await updateDiagnostics('host',pc);await waitForIceComplete('host',pc);if(!isCurrentPc('host',pc,attempt))return;if(summarizeIce(pc.localDescription?.sdp).count===0)throw iceError('ICE_NO_LOCAL_CANDIDATES');state.host.offerCode=await encodeSignal(pc.localDescription);q('[data-host-offer-code]').value=state.host.offerCode;q('[data-action="host-copy"]').disabled=false;q('[data-action="host-scan-answer"]').disabled=false;setStatus('host',t('offerReady'),'active');setStep('host',2);setCoach('host','offer');state.qr.hostPages=makeTransferPages(state.host.offerCode);state.qr.hostIndex=0;await showQr('host');startQrCycle('host');emitState('host','offer-ready',{pc});
      } catch(error) {
        if(pc&&!isCurrentPc('host',pc,attempt))return;const message=iceMessage(error);if(pc)await updateDiagnostics('host',pc,{warning:true,note:message});setStatus('host',message,'warning');setCoach('host','failed');emitState('host','offer-failed',{error});notify(message,'warning');closePc('host');
      } finally { q('[data-action="host-create"]').disabled=false; }
    }

    async function acceptJoinOffer(code) { resetJoin({keepView:true});state.role='join';showView('join');try{const remote=await decodeSignal(code);if(remote.type!=='offer')throw new Error('not offer');if(summarizeIce(remote.sdp).count===0)throw iceError('ICE_NO_REMOTE_CANDIDATES');state.join.pendingOffer=remote;state.join.answerState='prepare';state.join.autoRetryCount=0;q('[data-join-prepare]').hidden=false;q('[data-join-answer]').hidden=true;setStep('join',2);setCoach('join','prepare');setStatus('join',t('prepareTitle'),'warning');const remoteSummary=summarizeIce(remote.sdp),el=q('[data-diagnostic="join"]');el.hidden=false;el.classList.remove('is-warning');el.textContent=`${t('diagRemote')}: ${remoteSummary.count}${remoteSummary.details?` · ${remoteSummary.details}`:''}`;emitState('join','offer-accepted',{remote});}catch(error){const message=String(error?.code||'').startsWith('ICE_')?iceMessage(error):t('invalidSignal');setStatus('join',message,'warning');setCoach('join','failed');notify(message,'warning');}}

    async function createJoinAnswer({auto=false}={}) {
      if(!state.join.pendingOffer)return;if(!auto)state.join.autoRetryCount=0;const remote=state.join.pendingOffer;const attempt=++state.join.attempt;closePc('join');state.join.failureHandling=false;state.join.answerCode='';state.join.answerState='preparing';q('[data-join-prepare]').hidden=true;q('[data-join-answer]').hidden=false;renderQrPlaceholder('join',auto?t('regeneratingAnswer'):t('creatingAnswer'));setStatus('join',auto?t('regeneratingAnswer'):t('creatingAnswer'),'warning');setCoach('join','answer');q('[data-action="join-create-answer"]').disabled=true;emitState('join','creating-answer',{auto});

      } finally { if(state.join.attempt===attempt)q('[data-action="join-create-answer"]').disabled=false; }
    }
    async function scheduleJoinRegeneration() { if(!state.join.pendingOffer||state.join.everConnected||state.join.failureHandling)return;state.join.failureHandling=true;if(state.join.autoRetryCount>=options.answerAutoRetryLimit){resetJoin({preserveOffer:true,preserveRetry:true,keepView:true});q('[data-join-prepare]').hidden=false;setStatus('join',t('retryExhausted'),'warning');notify(t('retryExhausted'),'warning');return;}state.join.autoRetryCount+=1;state.join.attempt+=1;closePc('join');state.join.failureHandling=true;stopQr('join');q('[data-join-answer]').hidden=false;renderQrPlaceholder('join',t('regeneratingAnswer'));setStatus('join',t('answerAutoRetry'),'warning');notify(t('answerAutoRetry'),'warning');if(state.join.autoRetryTimer)clearTimeout(state.join.autoRetryTimer);state.join.autoRetryTimer=setTimeout(()=>{state.join.autoRetryTimer=0;void createJoinAnswer({auto:true});},options.answerAutoRetryDelayMs); }

    async function applyHostAnswer(code) { const pc=state.host.pc;if(!pc)return;const attempt=state.host.attempt;let applied=false;try{const remote=await decodeSignal(code);if(remote.type!=='answer')throw new Error('not answer');await pc.setRemoteDescription(remote);applied=true;if(!isCurrentPc('host',pc,attempt))return;if(summarizeIce(pc.remoteDescription?.sdp).count===0)throw iceError('ICE_NO_REMOTE_CANDIDATES');state.host.answerApplied=true;setCoach('host','checking');setStatus('host',t('checking'),'warning');setStep('host',3);await updateDiagnostics('host',pc);emitState('host','answer-applied',{pc});setTimeout(()=>{if(isCurrentPc('host',pc,attempt)&&!state.host.everConnected){setCoach('host','slow');setStatus('host',t('hostCoachSlowTitle'),'warning');void updateDiagnostics('host',pc,{warning:true});}},7000);}catch(error){const message=String(error?.code||'').startsWith('ICE_')?iceMessage(error):t('invalidSignal');if(applied&&isCurrentPc('host',pc,attempt)){await updateDiagnostics('host',pc,{warning:true,note:message});setStatus('host',message,'warning');setCoach('host','failed');closePc('host');}notify(message,'warning');}}

    async function ensureQrLibrary() { if(typeof window.qrcode==='function')return window.qrcode;if(!window.StandaloneAssets?.loadClassicScript)throw new Error('StandaloneAssets unavailable');await window.StandaloneAssets.loadClassicScript(options.qrDependencyId,options.qrAssetKey,'qrcode');if(typeof window.qrcode!=='function')throw new Error('qrcode global unavailable');return window.qrcode; }
    async function renderQr(target,text) { const factory=await ensureQrLibrary(),qr=factory(0,'L');qr.addData(text,'Byte');qr.make();target.innerHTML=qr.createSvgTag({cellSize:3,margin:12,scalable:true,alt:language==='ja'?'接続用QRコード':'Connection QR code'}); }
    function renderQrPlaceholder(role,text) { q(`[data-qr="${role}"]`).innerHTML=`<div class="app-webrtc-qr-placeholder">${escapeHtml(text)}</div>`;q(`[data-qr-progress="${role}"]`).textContent='—'; }
    async function showQr(role,index=null) { const pages=role==='host'?state.qr.hostPages:state.qr.joinPages;if(!pages.length)return;const key=role==='host'?'hostIndex':'joinIndex';if(index!==null)state.qr[key]=(index+pages.length)%pages.length;const i=state.qr[key];await renderQr(q(`[data-qr="${role}"]`),pages[i]);q(`[data-qr-progress="${role}"]`).textContent=`${i+1} / ${pages.length}`;if(!q('[data-fullscreen]').hidden&&q('[data-fullscreen]').dataset.role===role){await renderQr(q('[data-fullscreen-qr]'),pages[i]);q('[data-fullscreen-progress]').textContent=`${i+1} / ${pages.length}`;}}
    function stopQr(role){const timerKey=role==='host'?'hostTimer':'joinTimer';if(state.qr[timerKey])clearInterval(state.qr[timerKey]);state.qr[timerKey]=0;}
    function stopQrCycles(){stopQr('host');stopQr('join');}
    function startQrCycle(role){stopQr(role);const pages=role==='host'?state.qr.hostPages:state.qr.joinPages;if(pages.length<2)return;const timerKey=role==='host'?'hostTimer':'joinTimer',delay=role==='host'?options.offerQrCycleMs:options.answerQrCycleMs;state.qr[timerKey]=setInterval(()=>{const key=role==='host'?'hostIndex':'joinIndex';void showQr(role,state.qr[key]+1);},delay);}
    function stepQr(role,delta){stopQr(role);const key=role==='host'?'hostIndex':'joinIndex';void showQr(role,state.qr[key]+delta).finally(()=>startQrCycle(role));}
    async function openFullscreen(role){const pages=role==='host'?state.qr.hostPages:state.qr.joinPages;if(!pages.length)return;q('[data-fullscreen]').hidden=false;q('[data-fullscreen]').dataset.role=role;await showQr(role);}

    function scannerElements(role){return {panel:q(`[data-scanner-panel="${role}"]`),video:q(`[data-scan-video="${role}"]`),canvas:q(`[data-scan-canvas="${role}"]`),resolution:q(`[data-scan-resolution="${role}"]`),progress:q(`[data-scan-progress="${role}"]`),cameraField:q(`[data-camera-field="${role}"]`),cameraSelect:q(`[data-camera-select="${role}"]`),chunks:q(`[data-scan-chunks="${role}"]`)};}
    async function ensureScannerDecoder(role) { if(state.scanner.decoder)return state.scanner.decoder;if('BarcodeDetector'in window){try{const formats=typeof BarcodeDetector.getSupportedFormats==='function'?await BarcodeDetector.getSupportedFormats():['qr_code'];if(formats.includes('qr_code')){const detector=new BarcodeDetector({formats:['qr_code']});state.scanner.decoder=async video=>(await detector.detect(video))[0]?.rawValue||'';return state.scanner.decoder;}}catch{}}if(typeof window.jsQR!=='function'){if(!window.StandaloneAssets?.loadClassicScript)throw new Error('StandaloneAssets unavailable');await window.StandaloneAssets.loadClassicScript(options.decoderDependencyId,options.decoderAssetKey,'jsQR');}if(typeof window.jsQR!=='function')throw new Error('jsQR unavailable');const canvas=scannerElements(role).canvas;state.scanner.canvasCtx=canvas.getContext('2d',{willReadFrequently:true});state.scanner.decoder=async video=>{if(!video.videoWidth||!video.videoHeight)return'';const scale=Math.min(1,1280/video.videoWidth),w=Math.max(320,Math.round(video.videoWidth*scale)),h=Math.max(240,Math.round(video.videoHeight*scale));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}state.scanner.canvasCtx.drawImage(video,0,0,w,h);const image=state.scanner.canvasCtx.getImageData(0,0,w,h);return window.jsQR(image.data,w,h,{inversionAttempts:'attemptBoth'})?.data||'';};return state.scanner.decoder; }
    async function openCamera(role,deviceId='') { if(state.scanner.stream)state.scanner.stream.getTracks().forEach(track=>track.stop());const els=scannerElements(role),videoConstraints={width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:15,max:30}};if(deviceId)videoConstraints.deviceId={exact:deviceId};else if(role==='join')videoConstraints.facingMode={ideal:'environment'};state.scanner.stream=await navigator.mediaDevices.getUserMedia({video:videoConstraints,audio:false});els.video.srcObject=state.scanner.stream;await els.video.play();const track=state.scanner.stream.getVideoTracks()[0],settings=track.getSettings?.()||{};els.resolution.textContent=format(t('resolution'),{width:settings.width||els.video.videoWidth||'—',height:settings.height||els.video.videoHeight||'—'});try{const caps=track.getCapabilities?.()||{},advanced={};if(caps.focusMode?.includes?.('continuous'))advanced.focusMode='continuous';await track.applyConstraints({width:{ideal:Math.min(1920,caps.width?.max||1920)},height:{ideal:Math.min(1080,caps.height?.max||1080)},advanced:Object.keys(advanced).length?[advanced]:[]});}catch{}const devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');els.cameraSelect.innerHTML='';devices.forEach((d,i)=>{const o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||`Camera ${i+1}`;if(d.deviceId===track.getSettings?.().deviceId)o.selected=true;els.cameraSelect.append(o);});els.cameraField.hidden=devices.length<2; }
    function renderChunks(role,total,parts){const bar=scannerElements(role).chunks;if(!total){bar.innerHTML='';return;}bar.innerHTML=Array.from({length:total},(_,i)=>`<span class="app-webrtc-scan-chunk${parts.has(i+1)?' is-done':''}"></span>`).join('');}
    function parseTransferQr(role,raw){if(raw.startsWith(`${options.payloadPrefix}.`))return{complete:raw};const prefix=options.qrPrefix.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),match=new RegExp(`^${prefix}\\.([a-z0-9]+)\\.(\\d+)\\.(\\d+)\\.(.+)$`,'i').exec(raw);if(!match)return null;const [,session,indexText,totalText,chunk]=match,index=Number(indexText),total=Number(totalText);if(index<1||total<1||index>total||total>20)return null;if(state.scanner.session!==session){state.scanner.session=session;state.scanner.total=total;state.scanner.parts=new Map();scannerElements(role).progress.textContent=format(t('pagesReady'),{total});renderChunks(role,total,state.scanner.parts);}if(state.scanner.total!==total)return null;state.scanner.parts.set(index,chunk);renderChunks(role,total,state.scanner.parts);scannerElements(role).progress.textContent=format(t('chunks'),{read:state.scanner.parts.size,total});if(state.scanner.parts.size===total){let full='';for(let i=1;i<=total;i++){if(!state.scanner.parts.has(i))return null;full+=state.scanner.parts.get(i);}return{complete:full};}return{partial:true};}
    async function startScanner(role) { if(!navigator.mediaDevices?.getUserMedia){notify(t('cameraUnsupported'),'warning');return;}stopScanner();state.scanner.mode=role;const els=scannerElements(role);try{state.scanner.session='';state.scanner.total=0;state.scanner.parts=new Map();state.scanner.lastDecode=0;els.progress.textContent=t('scanStart');renderChunks(role,0,new Map());els.panel.hidden=false;await ensureScannerDecoder(role);await openCamera(role);if(role==='host')els.progress.textContent=t('scanReady');const tick=async now=>{if(!state.scanner.stream)return;if(now-state.scanner.lastDecode>180){state.scanner.lastDecode=now;try{const raw=await state.scanner.decoder(els.video);if(raw){const parsed=parseTransferQr(role,String(raw).trim());if(parsed?.complete){if(role==='join'){q('[data-join-offer-input]').value=parsed.complete;notify(t('scanOfferFound'));stopScanner();await acceptJoinOffer(parsed.complete);return;}q('[data-host-answer-input]').value=parsed.complete;q('[data-action="host-apply-answer"]').disabled=false;notify(t('scanAnswerFound'));stopScanner();await applyHostAnswer(parsed.complete);return;}}}catch{}}state.scanner.frame=requestAnimationFrame(tick);};state.scanner.frame=requestAnimationFrame(tick);}catch(error){console.warn(error);notify(t('cameraFailed'),'warning');stopScanner();}}
    function stopScanner(){if(state.scanner.frame)cancelAnimationFrame(state.scanner.frame);state.scanner.frame=0;state.scanner.decoder=null;state.scanner.canvasCtx=null;state.scanner.lastDecode=0;if(state.scanner.stream){state.scanner.stream.getTracks().forEach(track=>track.stop());state.scanner.stream=null;}qa('[data-scanner-panel]').forEach(el=>el.hidden=true);qa('[data-scan-video]').forEach(video=>video.srcObject=null);state.scanner.mode='';}

    async function copyText(text){try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();}notify(t('copied'));}catch{notify(t('copyFailed'),'warning');}}
    function updateStatusFromConnection(role){const pc=state[role].pc;if(!pc){setStatus(role,state[role].pendingOffer?t('prepareTitle'):t('stateNew'));return;}if(pc.connectionState==='connected')setStatus(role,t('connected'),'active');else if(pc.connectionState==='failed')setStatus(role,t('failed'),'warning');else if(pc.connectionState==='disconnected')setStatus(role,t('disconnected'),'warning');}

    root.addEventListener('click', event=>{
      const button=event.target.closest('[data-action]');if(!button||!root.contains(button))return;const action=button.dataset.action;
      if(action==='host')void startHost();else if(action==='join'){resetHost({keepView:true});state.role='join';showView('join');applyLanguage();setCoach('join','scan');if(options.autoStartJoinScanner)void startScanner('join');}
      else if(action==='chooser')resetAll();else if(action==='host-create')void createHostOffer();else if(action==='host-copy')void copyText(state.host.offerCode);else if(action==='host-scan-answer'){setCoach('host','answer');void startScanner('host');}
      else if(action==='host-apply-answer')void applyHostAnswer(q('[data-host-answer-input]').value.trim());else if(action==='join-scan-offer')void startScanner('join');else if(action==='join-use-offer')void acceptJoinOffer(q('[data-join-offer-input]').value.trim());else if(action==='join-create-answer')void createJoinAnswer();else if(action==='join-copy-answer')void copyText(state.join.answerCode);
      else if(action==='host-prev')stepQr('host',-1);else if(action==='host-next')stepQr('host',1);else if(action==='join-prev')stepQr('join',-1);else if(action==='join-next')stepQr('join',1);else if(action==='host-fullscreen')void openFullscreen('host');else if(action==='join-fullscreen')void openFullscreen('join');else if(action==='close-fullscreen')q('[data-fullscreen]').hidden=true;
      else if(action==='host-stop-camera'||action==='join-stop-camera')stopScanner();else if(action==='disconnect'){closePc(state.role);state.connected=false;q(`[data-connected="${state.role}"]`).hidden=true;setStatus(state.role,t('closed'));emitState(state.role,'closed');}
    });
    root.addEventListener('input',event=>{if(event.target.matches('[data-host-answer-input]'))q('[data-action="host-apply-answer"]').disabled=!event.target.value.trim();});
    root.addEventListener('change',event=>{if(event.target.matches('[data-camera-select]')){const role=event.target.dataset.cameraSelect;state.scanner.mode=role;void openCamera(role,event.target.value).catch(()=>notify(t('cameraFailed'),'warning'));}});
    const onKeydown=event=>{if(event.key==='Escape'&&!q('[data-fullscreen]').hidden)q('[data-fullscreen]').hidden=true;};
    document.addEventListener('keydown',onKeydown);

    applyLanguage();showView('chooser');

    const api = {
      setLanguage(value){language=value==='en'?'en':'ja';applyLanguage();},
      language(){return language;},
      startHost(){return startHost();},
      startJoin(){resetHost({keepView:true});resetJoin({keepView:true});state.role='join';showView('join');applyLanguage();setCoach('join','scan');return options.autoStartJoinScanner?startScanner('join'):Promise.resolve();},
      showRoleChooser(){resetAll();},
      send(data){const bucket=state[state.role],ch=bucket?.readyChannel||bucket?.channel;if(!ch||ch.readyState!=='open')throw new Error('DataChannel is not open');ch.send(data);},
      channel(){const bucket=state[state.role];return bucket?.readyChannel||bucket?.channel||null;},
      peerConnection(){return state[state.role]?.pc||null;},
      role(){return state.role;},
      close(){resetAll();},
      destroy(){state.destroyed=true;document.removeEventListener('keydown',onKeydown);resetAll();root.replaceChildren();root.classList.remove('app-webrtc-pairing');}
    };
    return api;
  }

  window.AppWebRtcQrPairing = Object.freeze({ mount });
})();
